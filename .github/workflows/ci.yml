name: CI

on:
  push:
    branches: [main, master, dev, qa/induscart-testing]
  pull_request:
    branches: [main, master, dev, qa/induscart-testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    name: Backend validation
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/induscart
      JWT_SECRET: ci-only-test-secret-not-for-deployment
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend syntax check
        working-directory: backend
        run: npm run check

      - name: Backend tests
        working-directory: backend
        run: npm test

  frontend-validation:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: induscart-frontend-build
          path: frontend/dist
          if-no-files-found: error

  docker-image-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend-validation, frontend-validation]
    env:
      JWT_SECRET: ci-only-compose-validation-secret-not-for-deployment
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password-not-for-deployment
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config --quiet

      - name: Build backend image
        run: docker build --tag induscart-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build --tag induscart-frontend:${{ github.sha }} ./frontend
