name: Deploy to production

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  deploy-prod:
    name: Production deployment
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show deployment notice
        run: echo "Production deployment would run here. Add your server deployment credentials to GitHub Secrets before enabling a real deploy step."
