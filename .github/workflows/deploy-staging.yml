name: Deploy to staging

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  deploy-stage:
    name: Deploy staging
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show deployment notice
        run: echo "Staging deployment would run here for the IndusCart app. Add your host/SSH or cloud provider credentials in repository secrets to enable this job."
